[package]
name = "etern-desktop"
version = "0.1.0"
description = "eternAI desktop companion"
edition = "2021"
license = "MIT"

[lib]
name = "etern_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
etern-core = { path = "../../../crates/etern-core" }
tauri = { version = "2.12", features = [] }
tauri-plugin-opener = "2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
# QR rendering only (no image crate); we emit SVG from the module grid.
qrcode = { version = "0.14", default-features = false }

[dev-dependencies]
# The end-to-end loop test drives a mock gateway over a real socket.
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
